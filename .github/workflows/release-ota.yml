name: Verify Web & Android OTA

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      channel:
        description: OTA channel to verify
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: release-ota-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-verify-and-release:
    name: Build & Verify OTA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Run server & contract TypeScript check
        run: npm run server:check

      - name: Run map data audit
        run: npm run map:audit

      - name: Classify native APK vs OTA changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_REF="$BEFORE_SHA"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          node --experimental-strip-types scripts/classifyGitChanges.mjs \
            --base "$BASE_REF" --head "$GITHUB_SHA" --out ota-artifacts/change-classification.json

      - name: Build and verify the hosted ZIP and offline catalog
        id: verify
        env:
          OTA_CHANNEL: ${{ inputs.channel || (github.ref_name == 'staging' && 'staging' || 'production') }}
          OTA_REQUIRES_NATIVE_APK: ${{ steps.changes.outputs.requires_native_apk }}
        run: npm run build:vercel

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ota-artifacts-${{ steps.verify.outputs.version }}
          path: ota-artifacts/
          retention-days: 14
